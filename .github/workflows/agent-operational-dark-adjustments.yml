name: Agent validate operational consistency dark themes and adjustments

on:
  push:
    branches:
      - agent/operational-consistency-dark-adjustments
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout technical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild clean commits
        shell: bash
        run: |
          set -euo pipefail
          cp .agent-tools/apply_operational_backend.py /tmp/apply_operational_backend.py
          cp .agent-tools/apply_dark_adjustments_frontend.py /tmp/apply_dark_adjustments_frontend.py
          sed -i 's|ROOT = Path(__file__).resolve().parents\[1\]|ROOT = Path.cwd()|' /tmp/apply_operational_backend.py
          sed -i 's|ROOT = Path(__file__).resolve().parents\[1\]|ROOT = Path.cwd()|' /tmp/apply_dark_adjustments_frontend.py
          git config user.name "adminfpestoque"
          git config user.email "adminfpestoque@users.noreply.github.com"
          git fetch origin main
          git checkout -B agent/operational-consistency-ready origin/main

          python /tmp/apply_operational_backend.py
          git add backend/inventory
          git commit -m "fix: align operational stock data with product catalog"

          python /tmp/apply_dark_adjustments_frontend.py
          git add frontend/src
          git commit -m "feat: complete stock adjustments and refine dark themes"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check Django migrations
        working-directory: backend
        env:
          USE_SQLITE_FOR_TESTS: "true"
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        working-directory: backend
        env:
          USE_SQLITE_FOR_TESTS: "true"
        run: python manage.py test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Publish validated commits
        shell: bash
        run: |
          set -euo pipefail
          git push origin agent/operational-consistency-ready --force
