name: Agent validate reference and document UI

on:
  push:
    branches:
      - agent/fix-product-references-and-document-ui
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply functional changes on main
        shell: bash
        run: |
          set -euo pipefail
          cp .agent-tools/fix_references_and_ui.py /tmp/fix_references_and_ui.py
          git config user.name "adminfpestoque"
          git config user.email "adminfpestoque@users.noreply.github.com"
          git fetch origin main
          git checkout -B agent/fix-product-references-and-document-ui-ready origin/main
          python /tmp/fix_references_and_ui.py
          git add frontend/src/pages/products.jsx
          git commit -m "fix: load product references independently"
          git add frontend/src/styles/checkout.css
          git commit -m "style: improve entry output and product forms"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate backend
        working-directory: backend
        env:
          USE_SQLITE_FOR_TESTS: "true"
          DJANGO_SECRET_KEY: "validation-only-secret-key-with-more-than-thirty-two-characters"
          DEBUG: "false"
        shell: bash
        run: |
          set -euo pipefail
          python manage.py check
          python manage.py makemigrations --check --dry-run
          rm -f db.sqlite3
          python manage.py migrate --noinput
          python manage.py test -v 2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm audit --omit=dev

      - name: Publish validated commits
        if: github.event_name == 'push'
        run: git push origin agent/fix-product-references-and-document-ui-ready --force
