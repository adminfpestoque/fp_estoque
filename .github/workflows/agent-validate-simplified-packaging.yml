name: Agent validate simplified packaging

on:
  push:
    branches:
      - agent/simplify-category-product-packaging
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout technical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply functional changes on main
        shell: bash
        run: |
          set -euo pipefail
          cp .agent-tools/simplify_packaging.py /tmp/simplify_packaging.py
          cp .agent-tools/update_simplified_packaging_tests.py /tmp/update_simplified_packaging_tests.py
          git config user.name "adminfpestoque"
          git config user.email "adminfpestoque@users.noreply.github.com"
          git fetch origin main
          git checkout -B agent/simplify-category-product-packaging-ready origin/main
          mkdir -p .agent-tools
          cp /tmp/simplify_packaging.py .agent-tools/simplify_packaging.py
          cp /tmp/update_simplified_packaging_tests.py .agent-tools/update_simplified_packaging_tests.py
          python .agent-tools/simplify_packaging.py
          python .agent-tools/update_simplified_packaging_tests.py
          rm -rf .agent-tools
          git add backend/inventory
          git commit -m "refactor: keep packaging types only on products"
          git add frontend/src
          git commit -m "refactor: simplify product entry and output forms"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate backend
        working-directory: backend
        env:
          USE_SQLITE_FOR_TESTS: "true"
          DJANGO_SECRET_KEY: "validation-only-secret-key-with-more-than-thirty-two-characters"
          DEBUG: "false"
          ALLOW_LAN_DEV: "false"
        shell: bash
        run: |
          set -o pipefail
          {
            python manage.py check
            python manage.py makemigrations --check --dry-run
            rm -f db.sqlite3
            python manage.py migrate --noinput
            python manage.py test -v 2
            python -m compileall -q .
          } 2>&1 | tee /tmp/backend-validation.log

      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simplified-packaging-backend
          path: /tmp/backend-validation.log
          retention-days: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm audit --omit=dev

      - name: Publish validated commits
        shell: bash
        run: |
          set -euo pipefail
          git push origin agent/simplify-category-product-packaging-ready --force
