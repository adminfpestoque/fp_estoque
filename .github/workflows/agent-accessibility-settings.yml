name: Agent validate accessibility settings and users

on:
  push:
    branches:
      - agent/accessibility-settings-users
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout technical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild clean commits
        shell: bash
        run: |
          set -euo pipefail
          cp .agent-tools/apply_accessibility_settings.py /tmp/apply_accessibility_settings.py
          git config user.name "adminfpestoque"
          git config user.email "adminfpestoque@users.noreply.github.com"
          git fetch origin main
          git checkout -B agent/accessibility-settings-ready origin/main
          python /tmp/apply_accessibility_settings.py

          git add backend/inventory
          git commit -m "fix: synchronize user status and persist accessibility preferences"

          git add frontend/src
          git commit -m "feat: complete settings with accessible interface themes"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check Django migrations
        working-directory: backend
        env:
          USE_SQLITE_FOR_TESTS: "true"
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        working-directory: backend
        env:
          USE_SQLITE_FOR_TESTS: "true"
        run: python manage.py test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Publish validated commits
        shell: bash
        run: |
          set -euo pipefail
          git push origin agent/accessibility-settings-ready --force
