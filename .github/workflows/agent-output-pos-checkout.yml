name: Agent validate complete output checkout

on:
  push:
    branches:
      - agent/output-pos-checkout
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout technical branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply output checkout patch
        shell: bash
        run: |
          run_patch() {
            set -euo pipefail
            echo "Part sizes and digests"
            wc -c .agent-tools/output-pos.patch.gz.b64.part*
            sha256sum .agent-tools/output-pos.patch.gz.b64.part*
            cat .agent-tools/output-pos.patch.gz.b64.part* > /tmp/output-pos.patch.gz.b64
            echo "Base64 size and digest"
            wc -c /tmp/output-pos.patch.gz.b64
            sha256sum /tmp/output-pos.patch.gz.b64
            echo "6dbc2276ccf175d8f581a7a92c1efd339b5a9f8cfbc63cc4ab3f183d5ac6501a  /tmp/output-pos.patch.gz.b64" | sha256sum -c -

            base64 --decode /tmp/output-pos.patch.gz.b64 > /tmp/output-pos.patch.gz
            echo "Gzip size and digest"
            wc -c /tmp/output-pos.patch.gz
            sha256sum /tmp/output-pos.patch.gz
            echo "1cbb8d61ce5f1858de8c47a86acd88a190b70f031383b861944ba208423b596a  /tmp/output-pos.patch.gz" | sha256sum -c -

            gzip --decompress --stdout /tmp/output-pos.patch.gz > /tmp/output-pos.patch
            echo "Patch size and digest"
            wc -c /tmp/output-pos.patch
            sha256sum /tmp/output-pos.patch
            echo "aa2b56dce9a3e32c30f362d5e46c750e2ab621bc670f752888aa7e3515991b37  /tmp/output-pos.patch" | sha256sum -c -

            git config user.name "adminfpestoque"
            git config user.email "adminfpestoque@users.noreply.github.com"
            git fetch origin main
            git checkout -B agent/output-pos-checkout-ready origin/main

            git apply --check /tmp/output-pos.patch
            git apply /tmp/output-pos.patch

            git add backend/inventory
            git commit -m "feat: support product packaging and checkout payments"

            git add frontend/src
            git commit -m "feat: complete output point-of-sale workflow"

            test -z "$(git status --porcelain)"
          }

          set +e
          run_patch > /tmp/output-pos-diagnostic.txt 2>&1
          result=$?
          set -e
          cat /tmp/output-pos-diagnostic.txt
          exit "$result"

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-pos-patch-diagnostics
          path: /tmp/output-pos-diagnostic.txt
          retention-days: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Validate Django configuration and migrations
        working-directory: backend
        env:
          USE_SQLITE_FOR_TESTS: "true"
          DJANGO_SECRET_KEY: "ci-only-secret-key-with-more-than-thirty-two-characters"
          DEBUG: "false"
        shell: bash
        run: |
          set -euo pipefail
          python manage.py check
          python manage.py makemigrations --check --dry-run
          rm -f db.sqlite3
          python manage.py migrate --noinput
          python -m compileall -q .

      - name: Run backend tests
        working-directory: backend
        env:
          USE_SQLITE_FOR_TESTS: "true"
          DJANGO_SECRET_KEY: "ci-only-secret-key-with-more-than-thirty-two-characters"
          DEBUG: "false"
        run: python manage.py test -v 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm audit --omit=dev

      - name: Publish validated commits
        shell: bash
        run: |
          set -euo pipefail
          git push origin agent/output-pos-checkout-ready --force
