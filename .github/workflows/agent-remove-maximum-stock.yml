name: Agent remove maximum stock

on:
  push:
    branches:
      - agent/remove-maximum-stock

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply changes on current main
        shell: bash
        run: |
          set -euo pipefail
          cp .agent-tools/remove_maximum_stock.py /tmp/remove_maximum_stock.py
          git config user.name "adminfpestoque"
          git config user.email "adminfpestoque@users.noreply.github.com"
          git fetch origin main
          git checkout -B agent/remove-maximum-stock-ready origin/main
          python /tmp/remove_maximum_stock.py
          git add -A
          git commit -m "refactor: remove maximum stock from system"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Validate backend
        working-directory: backend
        env:
          USE_SQLITE_FOR_TESTS: "true"
          DJANGO_SECRET_KEY: "validation-only-secret-key-with-more-than-thirty-two-characters"
          DEBUG: "false"
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run
          rm -f db.sqlite3
          python manage.py migrate --noinput
          python manage.py test -v 2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Publish validated commit
        run: git push origin agent/remove-maximum-stock-ready --force
