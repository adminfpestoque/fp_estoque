name: Generate missing packaging migration

on:
  push:
    branches:
      - agent/fix-packaging-route-and-api-errors
    paths:
      - .agent-tools/generate-packaging-migration

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-packaging-route-and-api-errors
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Generate and commit migration
        env:
          USE_SQLITE_FOR_TESTS: "true"
          DJANGO_SECRET_KEY: "migration-only-secret-key-with-more-than-thirty-two-characters"
          DEBUG: "false"
          ALLOW_LAN_DEV: "false"
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          python manage.py makemigrations inventory
          cd ..
          rm -f .agent-tools/generate-packaging-migration
          rm -f .github/workflows/agent-generate-packaging-migration.yml
          git config user.name "adminfpestoque"
          git config user.email "adminfpestoque@users.noreply.github.com"
          git add backend/inventory/migrations .agent-tools .github/workflows
          git commit -m "fix: add missing packaging model migration"
          git push origin agent/fix-packaging-route-and-api-errors
