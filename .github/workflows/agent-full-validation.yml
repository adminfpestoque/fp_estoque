name: Full validation before merge

on:
  push:
    branches:
      - agent/fix-packaging-route-and-api-errors
    paths:
      - .agent-tools/run-full-validation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-packaging-route-and-api-errors
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate backend
        working-directory: backend
        env:
          USE_SQLITE_FOR_TESTS: "true"
          DJANGO_SECRET_KEY: "validation-only-secret-key-with-more-than-thirty-two-characters"
          DEBUG: "false"
          ALLOW_LAN_DEV: "false"
        shell: bash
        run: |
          set -euo pipefail
          python manage.py check
          python manage.py makemigrations --check --dry-run
          rm -f db.sqlite3
          python manage.py migrate --noinput
          python manage.py test -v 2
          python -m compileall -q .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm audit --omit=dev
      - name: Record successful validation
        shell: bash
        run: |
          set -euo pipefail
          printf 'Backend checks, migrations, tests, Python compilation, frontend build and production dependency audit completed successfully.\n' > .agent-validation-success
          rm -f .agent-tools/run-full-validation
          rm -f .github/workflows/agent-full-validation.yml
          git config user.name "adminfpestoque"
          git config user.email "adminfpestoque@users.noreply.github.com"
          git add .agent-validation-success .agent-tools .github/workflows
          git commit -m "test: record successful full validation"
          git push origin agent/fix-packaging-route-and-api-errors
