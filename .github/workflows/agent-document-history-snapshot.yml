name: Agent validate editable stock document history

on:
  push:
    branches:
      - agent/document-history
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout technical payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild clean commits
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .agent-payload/document-history.b64 > /tmp/document-history-fixes.tar.gz
          echo "abfde56608922fadfb8ca2bbb777ce3b878a75bbf5583d7420b5b328e6a84fed  /tmp/document-history-fixes.tar.gz" | sha256sum --check
          mkdir -p /tmp/document-history-fixes
          tar -xzf /tmp/document-history-fixes.tar.gz -C /tmp/document-history-fixes

          git config user.name "adminfpestoque"
          git config user.email "adminfpestoque@users.noreply.github.com"
          git fetch origin main
          git checkout -B agent/document-history-ready origin/main

          cp /tmp/document-history-fixes/backend/inventory/migrations/0006_document_soft_delete_history.py backend/inventory/migrations/0006_document_soft_delete_history.py
          cp /tmp/document-history-fixes/backend/inventory/models/catalog.py backend/inventory/models/catalog.py
          cp /tmp/document-history-fixes/backend/inventory/models/entry.py backend/inventory/models/entry.py
          cp /tmp/document-history-fixes/backend/inventory/models/movement.py backend/inventory/models/movement.py
          cp /tmp/document-history-fixes/backend/inventory/models/output.py backend/inventory/models/output.py
          cp /tmp/document-history-fixes/backend/inventory/reports/common.py backend/inventory/reports/common.py
          cp /tmp/document-history-fixes/backend/inventory/reports/daily.py backend/inventory/reports/daily.py
          cp /tmp/document-history-fixes/backend/inventory/reports/generic.py backend/inventory/reports/generic.py
          cp /tmp/document-history-fixes/backend/inventory/serializers/catalog.py backend/inventory/serializers/catalog.py
          cp /tmp/document-history-fixes/backend/inventory/serializers/documents.py backend/inventory/serializers/documents.py
          cp /tmp/document-history-fixes/backend/inventory/services.py backend/inventory/services.py
          cp /tmp/document-history-fixes/backend/inventory/test_data_governance.py backend/inventory/test_data_governance.py
          cp /tmp/document-history-fixes/backend/inventory/test_document_history.py backend/inventory/test_document_history.py
          cp /tmp/document-history-fixes/backend/inventory/views/catalog.py backend/inventory/views/catalog.py
          cp /tmp/document-history-fixes/backend/inventory/views/documents.py backend/inventory/views/documents.py
          git add backend/inventory
          git commit -m "feat: add editable soft-deleted stock documents"

          cp /tmp/document-history-fixes/frontend/src/pages/documents.jsx frontend/src/pages/documents.jsx
          cp /tmp/document-history-fixes/frontend/src/shared.jsx frontend/src/shared.jsx
          cp /tmp/document-history-fixes/frontend/src/styles/content.css frontend/src/styles/content.css
          git add frontend/src
          git commit -m "feat: show deleted entries and outputs in history"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check Django migrations
        working-directory: backend
        env:
          USE_SQLITE_FOR_TESTS: "true"
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        working-directory: backend
        run: python manage.py test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Publish validated commits
        shell: bash
        run: |
          set -euo pipefail
          git push origin agent/document-history-ready --force-with-lease
