name: Agent export repository

on:
  push:
    branches:
      - agent/unified-packaging-entry

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository
        run: |
          tar --exclude=.git --exclude=.github/workflows/agent-export-repository.yml -czf /tmp/fp_estoque.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: fp-estoque-source
          path: /tmp/fp_estoque.tar.gz
          retention-days: 1
