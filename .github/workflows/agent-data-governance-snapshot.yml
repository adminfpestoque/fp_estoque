name: Agent data governance snapshot

on:
  push:
    branches:
      - agent/data-governance-deletion

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: fp-estoque-governance-source
          path: |
            .
            !.git/**
            !frontend/node_modules/**
            !frontend/dist/**
            !backend/.venv/**
            !backend/db.sqlite3
          retention-days: 1
      - name: Confirm snapshot
        run: echo "Governance snapshot created"
