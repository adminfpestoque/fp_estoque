name: Agent validate data governance policies

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout technical payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild clean commits
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-payload/governance.part* > /tmp/governance-fixes.b64
          base64 --decode /tmp/governance-fixes.b64 > /tmp/governance-fixes.tar.gz
          echo "dda0bad52ba9ba2783266e820fd7e5f7a2aa3931a85d500e3e70e6113f4480fc  /tmp/governance-fixes.tar.gz" | sha256sum --check
          mkdir -p /tmp/governance-fixes
          tar -xzf /tmp/governance-fixes.tar.gz -C /tmp/governance-fixes

          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/governance-fixes/backend/inventory/views/common.py')
          text = path.read_text()
          if 'def error_detail' not in text:
              marker = 'from ..services import audit\n\n\n'
              helper = '''from ..services import audit


def error_detail(exc):
    if hasattr(exc, "message_dict"):
        return exc.message_dict
    return getattr(exc, "messages", [str(exc)])


'''
              text = text.replace(marker, helper)
              path.write_text(text)
          PY

          git config user.name "adminfpestoque"
          git config user.email "adminfpestoque@users.noreply.github.com"
          git fetch origin main
          git checkout -B agent/data-governance-clean origin/main

          cp /tmp/governance-fixes/backend/inventory/views/common.py backend/inventory/views/common.py
          cp /tmp/governance-fixes/backend/inventory/views/catalog.py backend/inventory/views/catalog.py
          cp /tmp/governance-fixes/backend/inventory/permissions.py backend/inventory/permissions.py
          cp /tmp/governance-fixes/backend/inventory/test_products.py backend/inventory/test_products.py
          cp /tmp/governance-fixes/backend/inventory/test_data_governance.py backend/inventory/test_data_governance.py
          git add \
            backend/inventory/views/common.py \
            backend/inventory/views/catalog.py \
            backend/inventory/permissions.py \
            backend/inventory/test_products.py \
            backend/inventory/test_data_governance.py
          git commit -m "feat: enforce data governance deletion policies"

          cp /tmp/governance-fixes/frontend/src/shared.jsx frontend/src/shared.jsx
          cp /tmp/governance-fixes/frontend/src/main.jsx frontend/src/main.jsx
          cp /tmp/governance-fixes/frontend/src/pages/products.jsx frontend/src/pages/products.jsx
          cp /tmp/governance-fixes/frontend/src/pages/categories.jsx frontend/src/pages/categories.jsx
          cp /tmp/governance-fixes/frontend/src/pages/suppliers.jsx frontend/src/pages/suppliers.jsx
          cp /tmp/governance-fixes/frontend/src/pages/users.jsx frontend/src/pages/users.jsx
          cp /tmp/governance-fixes/frontend/src/pages/notifications.jsx frontend/src/pages/notifications.jsx
          cp /tmp/governance-fixes/frontend/src/styles/base.css frontend/src/styles/base.css
          cp /tmp/governance-fixes/frontend/src/styles/content.css frontend/src/styles/content.css
          git add \
            frontend/src/shared.jsx \
            frontend/src/main.jsx \
            frontend/src/pages/products.jsx \
            frontend/src/pages/categories.jsx \
            frontend/src/pages/suppliers.jsx \
            frontend/src/pages/users.jsx \
            frontend/src/pages/notifications.jsx \
            frontend/src/styles/base.css \
            frontend/src/styles/content.css
          git commit -m "feat: add explicit activation and deletion controls"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check Django migrations
        working-directory: backend
        env:
          USE_SQLITE_FOR_TESTS: "true"
        run: |
          set -euo pipefail
          python manage.py makemigrations --check --dry-run 2>&1 | tee /tmp/migrations.log

      - name: Run backend tests
        working-directory: backend
        env:
          USE_SQLITE_FOR_TESTS: "true"
        run: |
          set -euo pipefail
          python manage.py test inventory -v 2 2>&1 | tee /tmp/backend-tests.log

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/frontend-build.log

      - name: Publish validated commits
        run: git push origin HEAD:refs/heads/agent/data-governance-clean --force

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-governance-validation
          path: |
            /tmp/migrations.log
            /tmp/backend-tests.log
            /tmp/frontend-build.log
          if-no-files-found: ignore
          retention-days: 2
